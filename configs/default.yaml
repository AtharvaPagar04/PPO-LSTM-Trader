{
  "data": {
    "window_size": 20,
    "train_split": 0.8,
    "timeframe": "1h"
  },
  "features": {
    "selected": [
      "log_return",
      "volatility_10",
      "volatility_20",
      "momentum_5",
      "momentum_10",
      "trend",
      "rsi",
      "body_ratio",
      "range_pct",
      "vol_z"
    ]
  },
  "training": {
    "seed": 42,
    "iterations": 120,
    "rollout_steps": 1024,
    "episode_length": 512,
    "batch_size": 64,
    "update_epochs": 4,
    "early_stopping_patience": 50,
    "learning_rate": 0.0003
  },
  "environment": {
    "transaction_cost": 0.0004,
    "drawdown_penalty": 0.1,
    "position_penalty": 0.05,
    "action_change_penalty": 0.001,
    "reward_scale": 50.0,
    "reward_clip": 5.0
  },
  "model": {
    "lstm_layers": 2,
    "hidden_size": 128,
    "dropout": 0.2
  },
  "evaluation": {
    "random_seed": 42
  }
}
